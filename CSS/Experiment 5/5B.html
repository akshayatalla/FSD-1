<!DOCTYPE html>
<html>
<head>
  <title>Tilted Fixed Background</title>
  <style>
    body {
      min-height: 200vh;
      margin: 0;
      font-family: Arial, sans-serif;
      position: relative;
      z-index: 1;
    }
    body::before {
      content: "";
      position: fixed;
      top: 50vh;
      left: 50%;
      transform: translate(-50%, -50%) rotate(-12deg);
      width: 60vw;
      height: 40vh;
      background: url("focus.jpg") center/cover no-repeat;
      z-index: 0;
      pointer-events: none;
    }
    .content {
      position: relative;
      z-index: 1;
      padding: 2rem;
    }
  </style>
</head>
<body>
  <div class="content">
    <h1>Fixed Tilted Background</h1>
    <p>Scroll down to see that the image stays in place halfway down the page.</p>
  </div>
</body>
</html>
