<!DOCTYPE html> 
<html> 
<head> 
<title>Week Days Display</title> 
<script> 
function displayWeekDay() { 
let dayNumber = parseInt(document.getElementById("dayInput").value); 
let day; 
switch (dayNumber) { 
case 1: day = "Sunday"; break; 
case 2: day = "Monday"; break; 
case 3: day = "Tuesday"; break; 
case 4: day = "Wednesday"; break; 
case 5: day = "Thursday"; break; 
case 6: day = "Friday"; break; 
case 7: day = "Saturday"; break; 
default: day = "Invalid input! Please enter a number between 1 and 7."; 
} 
document.getElementById("result").innerText = "The day of the week is: " 
+ day; 
} 
</script> 
</head> 
<body> 
<h2>Enter a Number (1–7) to Display Week Day</h2> 
<input type="number" id="dayInput" placeholder="Enter number (1–7)">   
<br><br> 
<button onclick="displayWeekDay()">Show Day</button> 
<p id="result"></p> 
</body> 
</html>
