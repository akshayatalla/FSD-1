<!DOCTYPE html>
<html>
<head>
  <title>Find Largest Number</title>
  <script>
    function findLargestnumber() {
      let n1 = parseFloat(document.getElementById("num1").value);
      let n2 = parseFloat(document.getElementById("num2").value);
      let n3 = parseFloat(document.getElementById("num3").value);
      let message;

      if (n1 === n2 && n2 === n3) {
        message = "EQUAL NUMBERS";
      } else {
        const largest = Math.max(n1, n2, n3);
        message = largest + " IS THE LARGEST NUMBER";
      }

      document.getElementById("result").innerText = message;
    }
  </script>
</head>
<body>
  <h2>Enter Three Numbers</h2>
  <input type="number" id="num1" placeholder="Enter first number">
  <br><br>
  <input type="number" id="num2" placeholder="Enter second number">
  <br><br>
  <input type="number" id="num3" placeholder="Enter third number">
  <br><br>
  <button onclick="findLargestnumber()">Find Largest</button>
  <p id="result"></p>
</body>
</html>
