<!DOCTYPE html> 
<html> 
<head> 
<title>Loop Examples</title> 
<script> 
function printNumbersForLoop() { 
let output = "For Loop: "; 
for (let i = 1; i <= 10; i++) { 
output += i + " "; 
} 
document.getElementById("forLoopResult").innerText = output; 
} 
function printNumbersWhileLoop() { 
let output = "While Loop: "; 
let i = 1; 
while (i <= 10) { 
output += i + " "; 
i++; 
} 
document.getElementById("whileLoopResult").innerText = output; 
} 
function printNumbersDoWhileLoop() { 
let output = "Do-While Loop: "; 
let i = 1; 
do { 
output += i + " "; 
i++; 
} while (i <= 10); 
document.getElementById("doWhileLoopResult").innerText = output; 
} 
</script> 
</head> 
<body> 
<h2>Print Numbers from 1 to 10 using Loops</h2> 
<button onclick="printNumbersForLoop()">For Loop</button> 
<p id="forLoopResult"></p> 
<button onclick="printNumbersWhileLoop()">While Loop</button> 
<p id="whileLoopResult"></p> 
<button onclick="printNumbersDoWhileLoop()">Do-While Loop</button> 
<p id="doWhileLoopResult"></p> 
</body> 
</html>
