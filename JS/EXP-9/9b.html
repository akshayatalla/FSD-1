<!DOCTYPE html> 
<html> 
<head> 
  <title>Number Functions</title> 
</head> 
<body> 
  <h2>Number Functions in JavaScript</h2> 
   
  <label for="num">Enter a number:</label> 
  <input type="number" id="num" placeholder="Enter a number"> 
   
  <br><br> 
  <button onclick="showFactorial()">Factorial</button> 
  <button onclick="showFibonacci()">Fibonacci</button> 
  <button onclick="showPrime()">Prime</button> 
  <button onclick="showPalindrome()">Palindrome</button> 
   
  <p id="result"></p> 
 
  <script> 
    // Factorial 
    function factorial(n) { 
      if (n === 0 || n === 1) return 1; 
      return n * factorial(n - 1); 
    } 
 
    // Fibonacci 
    function fibonacciSeries(n) { 
      let fib = [0, 1]; 
      for (let i = 2; i < n; i++) { 
        fib[i] = fib[i - 1] + fib[i - 2]; 
      } 
      return fib.slice(0, n); 
    } 
 
    // Prime numbers 
    function primeNumbers(n) { 
      let primes = []; 
      for (let i = 2; i <= n; i++) { 
        let isPrime = true;

} 
isPrime = false; 
break; 
} 
if (isPrime) primes.push(i); 
} 
return primes; 
} 
// Palindrome 
function isPalindrome(num) { 
let str = num.toString(); 
let reversed = str.split('').reverse().join(''); 
return str === reversed; 
} 
// Display Functions 
function showFactorial() { 
let n = parseInt(document.getElementById("num").value); 
document.getElementById("result").innerHTML =  
"Factorial of " + n + " = " + factorial(n); 
} 
function showFibonacci() { 
let n = parseInt(document.getElementById("num").value); 
document.getElementById("result").innerHTML =  
"Fibonacci series up to " + n + " = " + fibonacciSeries(n).join(", "); 
} 
function showPrime() { 
let n = parseInt(document.getElementById("num").value); 
document.getElementById("result").innerHTML =  
"Prime numbers up to " + n + " = " + primeNumbers(n).join(", "); 
} 
function showPalindrome() { 
let n = parseInt(document.getElementById("num").value); 
document.getElementById("result").innerHTML =  
n + (isPalindrome(n) ? " is a Palindrome." : " is NOT a Palindrome."); 
} 
</script> 
</body> 
</html>
