<!DOCTYPE html>
<html>
<head>
    <title>HTML Links Example</title>
</head>
<body>
    <h2>Hyperlink Demonstration</h2>

    <p>Open Google in the same tab:</p>
    <a href="https://www.google.com">Visit Google</a>

    <p>Open YouTube in a new tab:</p>
    <a href="https://www.youtube.com" target="_blank">Visit YouTube</a>

    <p>Open local page (about.html):</p>
    <a href="about.html" target="_self">Open About Page</a>

</body>
</html>
