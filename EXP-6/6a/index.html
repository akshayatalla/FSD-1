<!DOCTYPE html>
<html>
<head>
  <title>Internal and External JavaScript</title>
</head>
<body>
  <h2>Internal and External JavaScript Demo</h2>

  <p id="internal"></p>
  <p id="external"></p>

  <!-- Internal JavaScript -->
  <script>
    document.getElementById('internal').innerHTML = "This text is added using Internal JavaScript!";
  </script>

  <!-- External JavaScript -->
  <script src="script.js"></script>
</body>
</html>
