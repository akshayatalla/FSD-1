<!DOCTYPE html>
<html>
<head>
  <title>JavaScript Output Methods</title>
</head>
<body>
  <h2>Ways to Display Output</h2>
  <button onclick="showOutput()">Show Output</button>

  <script>
    function showOutput() {
      // 1. Using innerHTML
      document.body.innerHTML += "<p><strong>1. innerHTML:</strong> Added inside the page dynamically.</p>";

      // 2. Using console.log
      console.log("2. console.log: This message is for debugging in browser console.");

      // 3. Using alert
      alert("3. alert: This is a popup message!");

      // 4. Using document.write
      document.write("<p><strong>4. document.write:</strong> Page replaced with this content!</p>");
    }
  </script>
</body>
</html>
