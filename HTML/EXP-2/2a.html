<!DOCTYPE html>
<html>
<head>
  <title>HTML Table Example</title>
</head>
<body>
  <h2>HTML Table Demo</h2>
  <table border="2">
    <tr>
      <th rowspan="2">Roll No</th>
      <th colspan="2">Student Name</th>
      <th rowspan="2">Marks</th>
    </tr>
    <tr>
      <th>First Name</th>
      <th>Last Name</th>
    </tr>
    <tr>
      <td>1</td>
      <td>John</td>
      <td>Doe</td>
      <td>85</td>
    </tr>
    <tr>
      <td>2</td>
      <td>Jane</td>
      <td>Smith</td>
      <td>90</td>
    </tr>
  </table>
</body>
</html>
